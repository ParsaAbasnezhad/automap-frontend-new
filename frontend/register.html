<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ثبت‌نام در اتومپ | Automap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/ui.css">
    <link rel="stylesheet" href="/static/css/account.css">
</head>
<body class="auth-page">

<main class="app auth-wrap">
    <div class="auth-card">
        <div class="auth-accent"></div>

        <div class="auth-header">
            <img class="auth-logo" src="/svg/logo_no_bg.svg" alt="لوگو" width="56" height="56" draggable="false">
            <h1>عضویت جدید</h1>
            <p>به سامانه اتومپ خوش آمدید</p>
        </div>

        <div class="auth-body">
            <form method="post" action="#" novalidate>

                <div class="row-2">
                    <div class="form-group">
                        <label for="id_first_name" class="form-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>نام
                        </label>
                        <input type="text"
                               name="first_name"
                               id="id_first_name"
                               class="form-control"
                               value=""
                               placeholder="نام"
                               required
                               autocomplete="given-name">
                    </div>

                    <div class="form-group">
                        <label for="id_last_name" class="form-label">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>نام خانوادگی
                        </label>
                        <input type="text"
                               name="last_name"
                               id="id_last_name"
                               class="form-control"
                               value=""
                               placeholder="نام خانوادگی"
                               required
                               autocomplete="family-name">
                    </div>
                </div>

                <div class="form-group">
                    <label for="id_phone" class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>شماره موبایل
                    </label>
                    <input type="tel"
                           name="phone"
                           id="id_phone"
                           class="form-control"
                           value=""
                           placeholder="۰۹۱۲۳۴۵۶۷۸۹"
                           dir="ltr"
                           maxlength="11"
                           required
                           autocomplete="tel">
                    <div class="form-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>شماره موبایل باید با ۰۹ شروع شود</div>
                </div>

                <div class="form-group">
                    <label for="id_national_id" class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5.5 16a3 3 0 0 1 5 0M14 10h5M14 14h3"/></svg>کد ملی
                    </label>
                    <input type="text"
                           name="national_id"
                           id="id_national_id"
                           class="form-control"
                           value=""
                           placeholder="کد ملی ۱۰ رقمی"
                           dir="ltr"
                           maxlength="10"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           required
                           autocomplete="off">
                    <div class="form-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>کد ملی باید ۱۰ رقم باشد</div>
                </div>

                <div class="form-group">
                    <label for="id_password1" class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4M18 5l3 3M15 8l2 2"/></svg>رمز عبور
                    </label>
                    <div class="input-group">
                        <input type="password"
                               name="password1"
                               id="id_password1"
                               class="form-control"
                               placeholder="رمز عبور قوی انتخاب کنید"
                               required
                               autocomplete="new-password">
                        <button type="button" class="pw-toggle" data-toggle-password="id_password1" aria-label="نمایش رمز عبور">
                            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                    <div class="form-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>حداقل ۸ کاراکتر، شامل حروف بزرگ، کوچک و عدد</div>
                    <div class="strength"><div class="strength-bar" id="passwordStrength"></div></div>
                </div>

                <div class="form-group">
                    <label for="id_password2" class="form-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg>تکرار رمز عبور
                    </label>
                    <div class="input-group">
                        <input type="password"
                               name="password2"
                               id="id_password2"
                               class="form-control"
                               placeholder="رمز عبور را تکرار کنید"
                               required
                               autocomplete="new-password">
                        <button type="button" class="pw-toggle" data-toggle-password="id_password2" aria-label="نمایش رمز عبور">
                            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="termsCheckbox" required>
                    <label for="termsCheckbox">
                        <a href="#" class="auth-inline-link">قوانین و مقررات</a> را مطالعه کرده و پذیرفته‌ام
                    </label>
                </div>

                <button type="submit" class="auth-submit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>ثبت‌نام و عضویت
                </button>
            </form>

            <div class="auth-footer">
                <span>قبلاً ثبت‌نام کرده‌اید؟</span>
                <a href="#" class="auth-link">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>وارد شوید
                </a>
            </div>
        </div>
    </div>
</main>

<script src="/static/js/ui.js"></script>
<script src="/static/js/account.js"></script>
</body>
</html>
