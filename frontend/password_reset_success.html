<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>رمز عبور تغییر کرد | Automap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/ui.css">
  <link rel="stylesheet" href="/static/css/account.css">
</head>
<body class="auth-page">

<main class="app auth-wrap">
  <div class="auth-card">
    <div class="auth-accent"></div>

    <div class="auth-header">
      <img class="auth-logo" src="/static/svg/logo_no_bg.svg" alt="لوگو" width="56" height="56" draggable="false">
      <h1>عملیات موفق</h1>
      <p>به سامانه اتومپ خوش آمدید</p>
    </div>

    <div class="auth-body">
      <div class="auth-hero">
        <span class="auth-hero-icon success"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg></span>

        <h3 class="auth-hero-title">رمز عبور شما با موفقیت تغییر کرد!</h3>

        <p>
          رمز عبور جدید شما ذخیره شد. اکنون می‌توانید با رمز جدید وارد حساب کاربری خود شوید.
        </p>
      </div>

      <a href="#" class="auth-submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>ورود به حساب کاربری
      </a>

      <div class="auth-footer">
        <span>به راهنمایی نیاز دارید؟</span>
        <a href="#" class="auth-link subtle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>تماس با پشتیبانی
        </a>
      </div>
    </div>
  </div>
</main>

<script src="/static/js/ui.js"></script>
<script src="/static/js/account.js"></script>
</body>
</html>
