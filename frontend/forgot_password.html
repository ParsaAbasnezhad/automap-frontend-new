<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>فراموشی رمز عبور | Automap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/ui.css">
  <link rel="stylesheet" href="/static/css/account.css">
</head>
<body class="auth-page">

<main class="app auth-wrap">
  <div class="auth-card">
    <div class="auth-accent"></div>

    <div class="auth-header">
      <img class="auth-logo" src="/static/svg/logo_no_bg.svg" alt="لوگو" width="56" height="56" draggable="false">
      <h1>بازیابی رمز عبور</h1>
      <p>به سامانه اتومپ خوش آمدید</p>
    </div>

    <div class="auth-body">
      <div class="auth-hero">
        <span class="auth-hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.85 12.15 19 4M18 5l3 3M15 8l2 2"/></svg></span>
        <p>
          رمز عبور خود را فراموش کرده‌اید؟ نگران نباشید!
          <br>
          لطفاً اطلاعات زیر را وارد کنید تا هویت شما تأیید شود.
        </p>
      </div>

      <form method="post" action="#" novalidate>

        <div class="form-group">
          <label for="id_phone" class="form-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>شماره موبایل
          </label>
          <input type="tel" name="phone" id="id_phone" class="form-control" placeholder="۰۹۱۲۳۴۵۶۷۸۹" dir="ltr" maxlength="11" required autocomplete="tel">
          <div class="form-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>شماره موبایل ثبت‌شده در حساب کاربری</div>
        </div>

        <div class="form-group">
          <label for="id_national_id" class="form-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8" cy="11" r="2"/><path d="M5.5 16a3 3 0 0 1 5 0M14 10h5M14 14h3"/></svg>کد ملی
          </label>
          <input type="text" name="national_id" id="id_national_id" class="form-control" placeholder="کد ملی ۱۰ رقمی" dir="ltr" maxlength="10" inputmode="numeric" pattern="[0-9]*" required autocomplete="off">
          <div class="form-text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>کد ملی ۱۰ رقمی ثبت‌شده در حساب</div>
        </div>

        <button type="submit" class="auth-submit">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11.5 14.5 16 9.5"/></svg>تأیید هویت و ادامه
        </button>
      </form>

      <div class="auth-footer">
        <span>حساب خود را به یاد آوردید؟</span>
        <a href="#" class="auth-link">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>بازگشت به ورود
        </a>
      </div>
    </div>
  </div>
</main>

<script src="/static/js/ui.js"></script>
<script src="/static/js/account.js"></script>
</body>
</html>
